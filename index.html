<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#111318" />
    <title>Nightspire — Playtest</title>
    <link rel="stylesheet" href="./src/style.css?v=5d5ddb61" />
    <link rel="stylesheet" href="./src/game/benchmark/benchmark.css" />
  </head>
  <body>
    <div id="app"></div>
    <script src="https://cdn.jsdelivr.net/npm/typescript@5.9.2/lib/typescript.js"></script>
    <script type="module">
      const moduleCache = new Map()
      const threeUrl = 'https://cdn.jsdelivr.net/npm/three@0.186.1/build/three.module.js'

      function resolveSpecifier(specifier, fromUrl) {
        if (specifier === 'three') return threeUrl
        const resolved = new URL(specifier, fromUrl)
        const name = resolved.pathname.split('/').at(-1) || ''
        if (!name.includes('.')) resolved.pathname += '.ts'
        return resolved.href
      }

      async function compileModule(url) {
        if (moduleCache.has(url)) return moduleCache.get(url)

        const pending = (async () => {
          const response = await fetch(url, { cache: 'no-store' })
          if (!response.ok) throw new Error(`Failed to load ${url}: HTTP ${response.status}`)
          let source = await response.text()
          source = source.replace(/^\s*import\s+['"][^'"]+\.css['"]\s*;?\s*$/gm, '')

          const output = ts.transpileModule(source, {
            fileName: url,
            compilerOptions: {
              target: ts.ScriptTarget.ES2022,
              module: ts.ModuleKind.ES2022,
              useDefineForClassFields: true,
            },
          }).outputText

          // Ask TypeScript for real module references instead of scanning emitted code with
          // a regex. The old regex could mistake UI strings such as "pickup from " + value
          // for an import specifier and then try to fetch a nonsense .ts path.
          const specifiers = ts.preProcessFile(output, true, true).importedFiles
            .map(file => file.fileName)
          let code = output

          for (const specifier of [...new Set(specifiers)]) {
            const resolved = resolveSpecifier(specifier, url)
            const replacement = resolved === threeUrl ? threeUrl : await compileModule(resolved)
            code = code.split(`'${specifier}'`).join(`'${replacement}'`)
            code = code.split(`"${specifier}"`).join(`"${replacement}"`)
          }

          return URL.createObjectURL(new Blob([code], { type: 'text/javascript' }))
        })()

        moduleCache.set(url, pending)
        return pending
      }

      try {
        const entryUrl = new URL('./src/main.ts', location.href)
        entryUrl.searchParams.set('runtime', 'ui-overview-44fd687')
        const entry = await compileModule(entryUrl.href)
        await import(entry)
      } catch (error) {
        console.error(error)
        const root = document.querySelector('#app')
        if (root) root.innerHTML = `<pre style="padding:24px;color:#ffd3d3;white-space:pre-wrap">Nightspire failed to start.\n\n${String(error)}</pre>`
      }
    </script>
  </body>
</html>
